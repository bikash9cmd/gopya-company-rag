# Render blueprint for the Streamlit chat UI (free web service).
services:
  - type: web
    name: gopya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m gopya ingest
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANONYMIZED_TELEMETRY
        value: "False"
